# FORK-ONLY: do not upstream to HeyItsChloe/agent-ops without confirming
# this staging file belongs there too (see CONTRIBUTING.md).
#
# 11thandOrange-fork staging registry, in pipeline-orchestrator's
# PipelineDefinition shape (see @heyitschloe/pipeline-orchestrator's README
# "Registry format" section). This is NOT the live registry the deployed
# orchestrator reads — that's still orchestrator/src/registry/pipelines.yaml,
# which is out of scope for this change (separate, currently-blocked
# orchestrator-retirement workstream that needs upstream HeyItsChloe/agent-ops
# access this session doesn't have).
#
# Purpose: a place to land new 11thandOrange pipeline entries (e.g. OrderMate
# below) and to mirror the already-migrated BusyBuddy_v2 entry, without
# touching orchestrator/. Once the retirement workstream unblocks, entries
# here get folded into the real registry (or this file becomes the real one,
# if the orchestrator/ wrapper goes away entirely) — until then this is
# fork-only bookkeeping, not something the deployed orchestrator consumes.

- name: busybuddy-dev
  handler: dev-ticket-pipeline
  # Mirrors orchestrator/src/registry/pipelines.yaml's busybuddy-dev entry
  # (already migrated to this shape on main) — kept in sync by hand until
  # the two registries are unified.
  skill_path: skills/shared/dev/project-conventions
  execution:
    kind: github-actions
    workflow: dev-pipeline-reusable.yml
    owner: 11thandOrange
    repo: BusyBuddy_v2
  triggers:
    labels: { approach-ready: plan, approved: implement }
    mentions: { "@dev-agent plan": plan, "@dev-agent implement": implement }
  params:
    model_profile: implementation
    test_command: "npm test -- --coverage"
    coverage_type: cobertura
    desired_coverage: 85
    project_language: [typescript]
    reviewer: heyitschloe

- name: ordermate-dev
  handler: dev-ticket-pipeline
  skill_path: skills/shared/dev/android-conventions
  execution:
    kind: github-actions
    workflow: dev-pipeline-reusable.yml
    owner: 11thandOrange
    repo: OrderMate
  triggers:
    labels: { approach-ready: plan, approved: implement }
    mentions: { "@dev-agent plan": plan, "@dev-agent implement": implement }
  params:
    model_profile: implementation
    # Real command, confirmed against OrderMate's own agent docs
    # (.agents/agents/tester.md, build-release.md, ordermate-implementer.md)
    # and its actual app/build.gradle.kts dependencies: `./gradlew test`
    # runs the JVM unit test suite (JUnit 4.13.2 + androidx.test.ext/Espresso
    # for androidTest, which this does not run). Not guessed.
    test_command: "./gradlew test"
    # ASSUMPTION (no coverage tooling actually wired up in OrderMate today):
    # app/build.gradle.kts has no jacoco plugin applied, despite tester.md
    # referencing a `./gradlew testDebugUnitTest jacocoTestReport` task —
    # that task does not currently exist/work in this project. jacoco is
    # picked here as the conventional choice for a JVM/Android project (and
    # what qodo-cover's own docs expect for Kotlin), but the jacoco Gradle
    # plugin and report wiring must be added to OrderMate's build before this
    # gate can actually run. desired_coverage is set low (40) as a starting
    # target given there is no existing coverage baseline to measure against.
    coverage_type: jacoco
    desired_coverage: 40
    project_language: [kotlin]
    reviewer: heyitschloe
