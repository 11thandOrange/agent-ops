# LiteLLM gateway config — every pipeline component calls a model *alias*
# (planning / implementation / classification), never a literal model name.
# Swapping the model behind an alias is a one-line edit here; nothing
# downstream (orchestrator, skills, GitHub Actions) needs to change.

model_list:
  - model_name: planning
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: implementation
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: classification
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

  # Uncomment once the Anthropic key lands — repointing these two aliases
  # is the only change needed anywhere in the system to switch to Claude.
  # - model_name: planning
  #   litellm_params:
  #     model: anthropic/claude-opus-4-8
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #
  # - model_name: implementation
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: implementation-fallback
    litellm_params:
      model: openai/gpt-5.1
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  fallbacks:
    - implementation: ["implementation-fallback"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# No database_url on purpose (decision, not an oversight): Postgres only
# backs LiteLLM's *optional* layer — dynamically-issued virtual keys,
# per-key spend tracking, and the Admin UI usage dashboard. The core
# proxy (model-alias routing above) doesn't need a database at all.
#
# Trade-off accepted for now: without a DB, there's no separate
# "scoped, revocable" key distinct from LITELLM_MASTER_KEY — the master
# key is what GitHub Actions/the orchestrator actually use. Keep it out
# of chat and out of any file in this repo regardless; treat it as
# sensitive as a normal API key even though it isn't DB-scoped.
#
# Budget alert: handled outside LiteLLM entirely — via GCP's native
# Billing → Budgets & alerts on the underlying Gemini/Vertex spend,
# since that's free and already covers the actual roadmap goal (a real
# alert before costs get away from you) without needing Postgres.
#
# Add Postgres back later (litellm/docker-compose.yml has the service
# definition in git history) once there's a real need for per-project
# dynamic keys or spend-by-repo breakdown — see docs/multi-pipeline-agent-strategy.md §3.
