# LiteLLM gateway config — every pipeline component calls a model *alias*
# (planning / implementation / classification), never a literal model name.
# Swapping the model behind an alias is a one-line edit here; nothing
# downstream (orchestrator, skills, GitHub Actions) needs to change.

model_list:
  - model_name: planning
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: implementation
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: classification
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

  # Uncomment once the Anthropic key lands — repointing these two aliases
  # is the only change needed anywhere in the system to switch to Claude.
  # - model_name: planning
  #   litellm_params:
  #     model: anthropic/claude-opus-4-8
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #
  # - model_name: implementation
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: implementation-fallback
    litellm_params:
      model: openai/gpt-5.1
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  fallbacks:
    - implementation: ["implementation-fallback"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Postgres is back (reversing an earlier "no DB" attempt): this LiteLLM
# build has a hard dependency on a DB connection existing for key auth —
# even a correct master key fails with a misleading "No connected db"
# error if neither prisma_client nor custom_db_client is configured
# (a known LiteLLM limitation, not something fixable from config alone).
#
# DATABASE_URL points at a free-tier Supabase Postgres instance (not a
# self-hosted container) — avoids Cloud SQL's recurring cost while still
# satisfying the hard DB requirement. Use Supabase's *direct* connection
# (port 5432), not the transaction-mode connection pooler (port 6543):
# the pooler doesn't support the multi-statement/advisory-lock behavior
# LiteLLM's startup `prisma migrate deploy` needs, and hangs/times out
# against it even with `?pgbouncer=true` set.
#
# Budget alert: still handled outside LiteLLM — via GCP's native
# Billing → Budgets & alerts on the underlying Gemini/Vertex spend —
# since LiteLLM's own DB-backed alerting isn't needed just because a DB
# exists now; GCP's is free and already covers the actual goal.
