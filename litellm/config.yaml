# LiteLLM gateway config — every pipeline component calls a model *alias*
# (planning / implementation / classification), never a literal model name.
# Swapping the model behind an alias is a one-line edit here; nothing
# downstream (orchestrator, skills, GitHub Actions) needs to change.

model_list:
  - model_name: planning
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: implementation
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: classification
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

  # Uncomment once the Anthropic key lands — repointing these two aliases
  # is the only change needed anywhere in the system to switch to Claude.
  # - model_name: planning
  #   litellm_params:
  #     model: anthropic/claude-opus-4-8
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #
  # - model_name: implementation
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: implementation-fallback
    litellm_params:
      model: openai/gpt-5.1
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  fallbacks:
    - implementation: ["implementation-fallback"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Budget alert: set at the same time this proxy first goes live (roadmap
# Phase 1, step 6), not deferred to a hardening pass. Configure via the
# LiteLLM admin UI or `/budget/settings` once the proxy is running — this
# file only defines routing, spend tracking itself needs the Postgres DB
# above plus a webhook/email target set through that API.
