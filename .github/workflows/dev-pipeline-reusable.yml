name: dev-pipeline-reusable

# The dev ticket pipeline's actual CI logic lives here, once, centrally
# (strategy doc §4.5) — app repos keep only a thin caller workflow
# (see templates/dev-pipeline-caller.yml) that passes their registry values.

on:
  workflow_call:
    inputs:
      # Comma-separated (e.g. "typescript" or "typescript,node") — GitHub Actions
      # workflow_call inputs have no list type. Matched against each shared
      # skill's own applies_to tag by the "Match shared skills" step below.
      project_language:
        required: true
        type: string
      test_command:
        required: true
        type: string
      coverage_type:
        required: true
        type: string
      desired_coverage:
        required: true
        type: number
      reviewer:
        required: true
        type: string
      action:
        required: true
        type: string # "plan" | "implement"
    secrets:
      LITELLM_PROXY_URL:
        required: true
      LITELLM_VIRTUAL_KEY:
        required: true
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true

jobs:
  plan:
    if: inputs.action == 'plan'
    runs-on: ubuntu-latest
    # id-token: write is required by anthropics/claude-code-action@v1 (OIDC token
    # request) — see docs/multi-pipeline-agent-strategy.md decision log. Reusable
    # workflow permissions are the *intersection* of what this job grants and what
    # the caller job grants, so the caller (e.g. BusyBuddy_v2's dev-pipeline.yml)
    # needs a matching permissions block too, or this alone won't be enough.
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Repo-local tier (strategy doc §6): a skill so specific to this one
      # repo that it lives in the repo's own checkout instead of agent-ops.
      # No applies_to matching needed — living here already scopes it.
      # Convention: any *.md anywhere under skills/ at this repo's root.
      # Empty today for every project (no repo-local skill exists yet) —
      # produces a clean empty list rather than erroring when skills/
      # doesn't exist.
      - name: List repo-local skills
        id: repo-skills
        run: |
          MATCHES=()
          if [ -d skills ]; then
            while IFS= read -r -d '' f; do
              MATCHES+=("$f")
            done < <(find skills -name '*.md' -print0 2>/dev/null | sort -z)
          fi
          echo "list<<REPO_SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
          if [ ${#MATCHES[@]} -gt 0 ]; then
            printf '%s\n' "${MATCHES[@]}" >> "$GITHUB_OUTPUT"
          fi
          echo "REPO_SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      # Skills live once, centrally, in agent-ops (strategy doc §6) — never
      # duplicated into caller repos. This workflow only checks out the
      # caller repo by default, so skill paths in the prompt below would
      # never exist without also checking out agent-ops here. Needs its
      # own App token: the caller repo (e.g. BusyBuddy_v2, under
      # 11thandOrange) and agent-ops (under HeyItsChloe) are different
      # accounts, so the caller-scoped app-token above can't read agent-ops.
      - uses: actions/create-github-app-token@v1
        id: agent-ops-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: HeyItsChloe
          repositories: agent-ops
      - uses: actions/checkout@v4
        with:
          repository: HeyItsChloe/agent-ops
          token: ${{ steps.agent-ops-token.outputs.token }}
          path: .agent-ops
      # .agent-ops is checked out *inside* this job's main working tree (its
      # own nested .git dir sitting under the caller repo's checkout), not
      # beside it. Without this, a broad `git add -A`/`git add .` (a command
      # Claude Code is entirely likely to run) would make git auto-stage it
      # as a gitlink — the same mechanism `git submodule add` uses — with no
      # matching .gitmodules entry, which is exactly the failure mode a
      # BusyBuddy_v2 run hit ("fatal: No url found for submodule path
      # '.agent-ops' in .gitmodules", run 28617869792, job 84866050500).
      # .git/info/exclude is a local-only ignore list: it keeps .agent-ops
      # out of git add/status for this checkout without touching the caller
      # repo's own committed .gitignore.
      - name: Exclude .agent-ops from git
        run: echo ".agent-ops/" >> .git/info/exclude
      # Every dev skill lives in agent-ops/skills/shared/dev/, tagged in its own
      # frontmatter with `applies_to: all`, `applies_to: [<language>, ...]`,
      # or `applies_to: [repo:<owner>/<name>]` (strategy doc §6). This step
      # is the only place that tag is ever read — it matches each skill's
      # applies_to against this project's project_language (comma-separated
      # input) and/or its own repo, and hands Claude Code the resulting file
      # list. Nothing here or in the prompt ever names a specific skill —
      # adding, narrowing, or repo-scoping a skill later never touches this
      # workflow.
      - name: Match shared skills
        id: match-skills
        env:
          PROJECT_LANGUAGE: ${{ inputs.project_language }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          IFS=',' read -ra LANGS <<< "$PROJECT_LANGUAGE"
          MATCHES=()
          for f in .agent-ops/skills/shared/dev/*/SKILL.md; do
            [ -f "$f" ] || continue
            TAG=$(awk '/^---$/{c++; next} c==1 && /^applies_to:/{print; exit}' "$f")
            VALUE=$(echo "$TAG" | sed -E 's/^applies_to:[[:space:]]*//')
            if [ "$VALUE" = "all" ]; then
              MATCHES+=("$f")
              continue
            fi
            LIST=$(echo "$VALUE" | tr -d '[]' | tr ',' '\n')
            MATCHED=false
            while IFS= read -r item; do
              item=$(echo "$item" | xargs)
              [ -z "$item" ] && continue
              if [ "$item" = "repo:$REPO_FULL_NAME" ]; then MATCHED=true; fi
              for lang in "${LANGS[@]}"; do
                lang=$(echo "$lang" | xargs)
                if [ "$item" = "$lang" ]; then MATCHED=true; fi
              done
            done <<< "$LIST"
            if [ "$MATCHED" = true ]; then
              MATCHES+=("$f")
            fi
          done
          echo "list<<SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${MATCHES[@]}" >> "$GITHUB_OUTPUT"
          echo "SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_PROXY_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.LITELLM_VIRTUAL_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          # ${{ github.event.issue.number }} covers the `issues` and
          # `issue_comment` triggers; ${{ github.event.client_payload.issue_number }}
          # covers repository_dispatch (chat/curl-originated jobs). The action
          # never auto-injects issue content into the model's context — the
          # prompt has to name the number explicitly and have the agent fetch
          # the content itself (confirmed live on run 28611383726: the agent
          # correctly refused to proceed on "this issue" with no number behind it).
          prompt: |
            The issue to work on is #${{ github.event.issue.number || github.event.client_payload.issue_number }}
            in this repository. Run `gh issue view ${{ github.event.issue.number || github.event.client_payload.issue_number }}
            --json number,title,body,comments` to read its actual content before doing anything else.

            Then read each of these skill files before doing anything else:
            ${{ steps.match-skills.outputs.list }}
            ${{ steps.repo-skills.outputs.list }}
            Produce an approach doc.

            Before creating sub-issues, list this parent's existing sub-issues
            and skip any whose title already matches the plan — this run must
            be safely re-runnable without creating duplicates.

            Create each sub-issue with exactly one command:
              gh issue create --parent <parent_number> --title '<title>' --body '<body>'
            This creates and links the sub-issue atomically in a single call —
            confirmed working reliably across multiple runs. Do NOT create a
            plain issue and then separately call `gh api .../sub_issues` (REST)
            or a GraphQL addSubIssue mutation to link it afterward — that
            two-step path reliably 403s ("Resource not accessible by
            integration") regardless of retries, and burns turns re-trying a
            call that will not succeed. If you ever end up with an issue that
            was created without --parent (e.g. by mistake), close it and
            recreate it correctly with --parent rather than trying to link the
            orphan retroactively.

            Once all sub-issues are created, post one comment on the parent
            issue tagging the reviewer. Do NOT use backticks anywhere in the
            --body text — the permission system denies any Bash command
            containing a backtick regardless of quoting, even inside a
            quoted string:
              gh issue comment ${{ github.event.issue.number || github.event.client_payload.issue_number }} --body "@${{ inputs.reviewer }} Planning complete - <N> sub-issues ready for review. Apply the approach-ready label to proceed."
            Replace <N> with the actual number of sub-issues you created (or
            found already existing, on a re-run).

            Then label this issue "approach-ready".
          # --permission-mode dontAsk + explicit --allowedTools: without this,
          # the agent stops and asks for interactive approval on its first
          # Bash/gh call, which has no human to answer it on a CI runner
          # (confirmed live on run 28563851004). Verified locally that
          # `dontAsk` executes tools correctly at the raw CLI level (both
          # with clean and deliberately-mangled --allowedTools values) — so
          # if this run still narrates instead of executing, the `settings`
          # JSON below (a second, independent mechanism for the same thing)
          # is the fallback to check, not this flag itself.
          claude_args: |
            --max-turns 16
            --model planning
            --permission-mode dontAsk
            --allowedTools "Read" "Bash(gh issue *)" "Bash(gh api *)" "Bash(gh sub-issue *)"
          settings: |
            {
              "permissions": {
                "defaultMode": "dontAsk",
                "allow": ["Read", "Bash(gh issue *)", "Bash(gh api *)", "Bash(gh sub-issue *)"]
              }
            }
          # Temporary, for debugging run 28561093550 — the SDK result showed
          # is_error: true with no visible error text because this defaults
          # to false. Revert once the root cause here is confirmed fixed.
          show_full_output: true

  implement:
    if: inputs.action == 'implement'
    runs-on: ubuntu-latest
    # Same id-token requirement as the plan job above.
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Same reasoning as the plan job's "List repo-local skills" step above.
      - name: List repo-local skills
        id: repo-skills
        run: |
          MATCHES=()
          if [ -d skills ]; then
            while IFS= read -r -d '' f; do
              MATCHES+=("$f")
            done < <(find skills -name '*.md' -print0 2>/dev/null | sort -z)
          fi
          echo "list<<REPO_SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
          if [ ${#MATCHES[@]} -gt 0 ]; then
            printf '%s\n' "${MATCHES[@]}" >> "$GITHUB_OUTPUT"
          fi
          echo "REPO_SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      # Same reasoning as the plan job above — skills live in agent-ops,
      # under a different account than most caller repos, so this needs
      # its own checkout and its own App token.
      - uses: actions/create-github-app-token@v1
        id: agent-ops-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: HeyItsChloe
          repositories: agent-ops
      - uses: actions/checkout@v4
        with:
          repository: HeyItsChloe/agent-ops
          token: ${{ steps.agent-ops-token.outputs.token }}
          path: .agent-ops
      # Same reasoning as the plan job above.
      - name: Exclude .agent-ops from git
        run: echo ".agent-ops/" >> .git/info/exclude
      # Same reasoning as the plan job's "Match shared skills" step above.
      - name: Match shared skills
        id: match-skills
        env:
          PROJECT_LANGUAGE: ${{ inputs.project_language }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          IFS=',' read -ra LANGS <<< "$PROJECT_LANGUAGE"
          MATCHES=()
          for f in .agent-ops/skills/shared/dev/*/SKILL.md; do
            [ -f "$f" ] || continue
            TAG=$(awk '/^---$/{c++; next} c==1 && /^applies_to:/{print; exit}' "$f")
            VALUE=$(echo "$TAG" | sed -E 's/^applies_to:[[:space:]]*//')
            if [ "$VALUE" = "all" ]; then
              MATCHES+=("$f")
              continue
            fi
            LIST=$(echo "$VALUE" | tr -d '[]' | tr ',' '\n')
            MATCHED=false
            while IFS= read -r item; do
              item=$(echo "$item" | xargs)
              [ -z "$item" ] && continue
              if [ "$item" = "repo:$REPO_FULL_NAME" ]; then MATCHED=true; fi
              for lang in "${LANGS[@]}"; do
                lang=$(echo "$lang" | xargs)
                if [ "$item" = "$lang" ]; then MATCHED=true; fi
              done
            done <<< "$LIST"
            if [ "$MATCHED" = true ]; then
              MATCHES+=("$f")
            fi
          done
          echo "list<<SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${MATCHES[@]}" >> "$GITHUB_OUTPUT"
          echo "SKILL_LIST_EOF" >> "$GITHUB_OUTPUT"
      # The branch name has to be known *before* Claude Code runs, not
      # discovered from it afterward — see the Qodo step's comment below for
      # why. Computed once here so the prompt and the Qodo `branch:` input
      # are guaranteed to reference the identical value.
      - name: Compute branch name
        id: branch
        run: echo "name=claude/issue-${{ github.event.issue.number || github.event.client_payload.issue_number }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_PROXY_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.LITELLM_VIRTUAL_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          # Same issue-number-interpolation fix as the plan job — the action
          # never auto-injects issue content, so the prompt has to name the
          # number and have the agent fetch the approach doc / sub-issues itself.
          prompt: |
            The approved issue is #${{ github.event.issue.number || github.event.client_payload.issue_number }}
            in this repository. Run `gh issue view ${{ github.event.issue.number || github.event.client_payload.issue_number }}
            --json number,title,body,comments` and list its sub-issues to read the
            approach doc and acceptance criteria before doing anything else.

            Before making any changes, create and check out a new branch
            named exactly `${{ steps.branch.outputs.name }}`
            (e.g. `git checkout -b ${{ steps.branch.outputs.name }}`) and do
            all your work on it. Do not rename it and do not check out any
            other branch afterward — a later workflow step reads this exact
            name from its own separately-computed value, not from you, so it
            must match precisely.

            Then read each of these skill files before doing anything else:
            ${{ steps.match-skills.outputs.list }}
            ${{ steps.repo-skills.outputs.list }}
            Implement the approved approach for this issue and its sub-issues.
            Write unit tests for the core logic as part of the implementation.
            Commit and push your branch, then open a PR from it and request
            review from ${{ inputs.reviewer }}.

            If you need to create any additional sub-issue during
            implementation, use exactly `gh issue create --parent <parent_number>
            --title '<title>' --body '<body>'` in one call — never create a
            plain issue and separately try to link it via `gh api .../sub_issues`
            or a GraphQL addSubIssue mutation, which 403s regardless of retries.
          # Same permission-mode fix as the plan job — but broader here: implement
          # has to run whatever build/test/lint commands the target project uses
          # (varies per repo, not enumerable in advance the way plan's gh
          # subcommands are), plus git/gh for committing and opening the PR.
          # Still narrower than --dangerously-skip-permissions/bypassPermissions,
          # which would also disable other safety guardrails, not just tool
          # approval prompts.
          claude_args: |
            --max-turns 30
            --model implementation
            --permission-mode dontAsk
            --allowedTools "Read" "Edit" "Write" "Bash"
          settings: |
            {
              "permissions": {
                "defaultMode": "dontAsk",
                "allow": ["Read", "Edit", "Write", "Bash"]
              }
            }
          # Same debugging flag as the plan job above.
          show_full_output: true

      - name: Qodo coverage gate
        uses: qodo-ai/qodo-ci/.github/actions/qodo-cover@v0.1.12
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # Two prior attempts at this input both reproduced the same
          # `--branch ""` fatal error (github.head_ref: empty because this
          # job isn't pull_request-triggered; steps.claude.outputs.branch_name:
          # empty because that output is only populated when the action
          # manages branch creation itself in "tag mode" — driven by
          # trigger_phrase/label_trigger/assignee_trigger or track_progress on
          # specific issue/PR event types — none of which this job sets, since
          # Claude Code creates the branch itself via the prompt's Bash
          # instructions instead. Confirmed via the action's own docs after
          # the branch_name fix reproduced verbatim on run 28617869792, job
          # 84866050500). Fix: stop trying to discover the branch name after
          # the fact — the "Compute branch name" step above fixes it in
          # advance and the prompt instructs Claude Code to use exactly that
          # name, so this input and the prompt are guaranteed to agree.
          branch: ${{ steps.branch.outputs.name }}
          project_language: ${{ inputs.project_language }}
          project_root: .
          code_coverage_report_path: ./coverage/cobertura-coverage.xml
          coverage_type: ${{ inputs.coverage_type }}
          test_command: ${{ inputs.test_command }}
          desired_coverage: ${{ inputs.desired_coverage }}
          max_iterations: 3
