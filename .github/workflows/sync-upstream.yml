name: sync-upstream

# Keeps this fork's main in sync with the canonical, private
# HeyItsChloe/agent-ops main. See CONTRIBUTING.md "Fork-only content" for
# why a conflicting sync must never auto-resolve: this fork can carry
# 11thandOrange-only content (marked `FORK-ONLY: do not upstream`) that a
# routine sync must not silently overwrite.

on:
  schedule:
    # Daily, 09:00 UTC. Frequent enough that this fork doesn't drift far
    # behind upstream, infrequent enough not to spam PRs on conflict.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint token for pushing to this repo
        uses: actions/create-github-app-token@v1
        id: self-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: 11thandOrange
          repositories: agent-ops

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # The default GITHUB_TOKEN can never create or update files under
          # .github/workflows/* - a hard GitHub platform restriction on the
          # automatic token, not something any repo/App setting can lift.
          # Use the App token instead (App has Actions: Read and write,
          # which does cover workflow files for App-issued tokens) so the
          # git push steps below can actually land workflow changes.
          token: ${{ steps.self-token.outputs.token }}

      - name: Mint upstream-scoped App token
        uses: actions/create-github-app-token@v1
        id: upstream-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: HeyItsChloe
          repositories: agent-ops

      - name: Fetch upstream main
        run: |
          git remote add upstream "https://x-access-token:${{ steps.upstream-token.outputs.token }}@github.com/HeyItsChloe/agent-ops.git"
          git fetch upstream main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge
        id: merge
        run: |
          # git merge, never rebase — rebasing would rewrite this fork's own
          # commit history, including fork-only commits (CONTRIBUTING.md).
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge directly to main
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD:main

      - name: On conflict, take upstream's side and push directly to main
        if: steps.merge.outputs.conflict == 'true'
        run: |
          # Resolve every conflicting path in upstream's favor except files
          # marked FORK-ONLY: do not upstream (CONTRIBUTING.md), commit, and
          # push straight to main - a failed `git merge` leaves conflicts
          # unstaged, so anything short of resolving+committing here would
          # push nothing at all.
          git diff --name-only --diff-filter=U | while read -r f; do
            if git show "upstream/main:$f" 2>/dev/null | head -1 | grep -q "FORK-ONLY: do not upstream"; then
              git checkout --ours -- "$f"
            else
              git checkout --theirs -- "$f"
            fi
          done
          git add -A
          git commit --no-edit
          git push origin HEAD:main
