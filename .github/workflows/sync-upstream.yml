name: sync-upstream

# Keeps this fork's main in sync with the canonical, private
# HeyItsChloe/agent-ops main. See CONTRIBUTING.md "Fork-only content" for
# why a conflicting sync must never auto-resolve: this fork can carry
# 11thandOrange-only content (marked `FORK-ONLY: do not upstream`) that a
# routine sync must not silently overwrite.

on:
  schedule:
    # Daily, 09:00 UTC. Frequent enough that this fork doesn't drift far
    # behind upstream, infrequent enough not to spam PRs on conflict.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Default GITHUB_TOKEN is used for the push/PR side (this repo's
          # own token already has write access to itself) — but checkout
          # still needs a token now so the later `git push` steps below
          # authenticate correctly against this repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint upstream-scoped App token
        uses: actions/create-github-app-token@v1
        id: upstream-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: HeyItsChloe
          repositories: agent-ops

      - name: Fetch upstream main
        run: |
          git remote add upstream "https://x-access-token:${{ steps.upstream-token.outputs.token }}@github.com/HeyItsChloe/agent-ops.git"
          git fetch upstream main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge
        id: merge
        run: |
          # git merge, never rebase — rebasing would rewrite this fork's own
          # commit history, including fork-only commits (CONTRIBUTING.md).
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge directly to main
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD:main

      - name: On conflict, take upstream's side and push directly to main
        if: steps.merge.outputs.conflict == 'true'
        run: |
          # Previous behavior (push a conflict branch + open a PR for human
          # review) had two real bugs: the App token lacked `pull-requests`
          # permission to open that PR, AND the conflict branch itself was
          # pushed with nothing committed (a failed `git merge` leaves the
          # conflict unstaged, so `git push` after it is a no-op) - so the
          # "branch for review" carried no diff at all either way.
          #
          # Given that, and given fork-only content is confined to files
          # marked `FORK-ONLY: do not upstream` (CONTRIBUTING.md), resolve
          # every conflicting path in upstream's favor except those, commit,
          # and push straight to main.
          git diff --name-only --diff-filter=U | while read -r f; do
            if git show "upstream/main:$f" 2>/dev/null | head -1 | grep -q "FORK-ONLY: do not upstream"; then
              git checkout --ours -- "$f"
            else
              git checkout --theirs -- "$f"
            fi
          done
          git add -A
          git commit --no-edit
          git push origin HEAD:main
