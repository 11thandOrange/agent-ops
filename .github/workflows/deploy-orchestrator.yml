name: deploy-orchestrator

# Deploys orchestrator/ to Cloud Run using only GitHub Secrets — no
# credential ever needs to be pasted into chat or stored in this repo.
# Trigger manually (Actions tab -> deploy-orchestrator -> Run workflow)
# or automatically on a push to main that touches orchestrator/.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "orchestrator/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build env vars file
        env:
          ORCHESTRATOR_SHARED_SECRET: ${{ secrets.ORCHESTRATOR_SHARED_SECRET }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID_11THANDORANGE }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          LITELLM_PROXY_URL: ${{ secrets.LITELLM_PROXY_URL }}
          LITELLM_VIRTUAL_KEY: ${{ secrets.LITELLM_VIRTUAL_KEY }}
          # (New) personal-pipeline extras — all optional, feature-gated in
          # server.ts by presence. Previously missing from this workflow
          # entirely: setting these as GitHub Secrets alone never reached the
          # deployed service until this step actually forwarded them too.
          JOB_API_BASE_URL: ${{ secrets.JOB_API_BASE_URL }}
          JOB_API_KEY: ${{ secrets.JOB_API_KEY }}
          SITE_SESSIONS_DIR: ${{ secrets.SITE_SESSIONS_DIR }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THE_STORE_OWNER: ${{ secrets.THE_STORE_OWNER }}
          THE_STORE_REPO: ${{ secrets.THE_STORE_REPO }}
          THE_STORE_BRANCH: ${{ secrets.THE_STORE_BRANCH }}
          THE_STORE_PATH: ${{ secrets.THE_STORE_PATH }}
        run: |
          python3 - <<'PYEOF'
          import os
          import yaml

          data = {
              "ORCHESTRATOR_SHARED_SECRET": os.environ["ORCHESTRATOR_SHARED_SECRET"],
              "GH_APP_ID": os.environ["GH_APP_ID"],
              "GH_APP_PRIVATE_KEY": os.environ["GH_APP_PRIVATE_KEY"],
              "GH_APP_INSTALLATION_ID": os.environ["GH_APP_INSTALLATION_ID"],
              "GH_WEBHOOK_SECRET": os.environ["GH_WEBHOOK_SECRET"],
              "ALLOWED_MENTION_AUTHORS": "heyitschloe",
              "LITELLM_PROXY_URL": os.environ["LITELLM_PROXY_URL"],
              "LITELLM_VIRTUAL_KEY": os.environ["LITELLM_VIRTUAL_KEY"],
              "CONTROL_REPO_OWNER": "HeyItsChloe",
              "CONTROL_REPO_NAME": "agent-ops",
              "CONTROL_REPO_BRANCH": "main",
          }

          # Optional vars: only included if the underlying secret is actually
          # set. gcloud run deploy --env-vars-file fully replaces the
          # service's env vars on every deploy, so an included-but-empty
          # value would set a literal empty string in Cloud Run — which
          # would defeat server.ts's own `?? "main"`-style defaults (empty
          # string isn't nullish, so those defaults wouldn't kick in).
          # Omitting the key entirely when unset avoids that.
          optional = [
              "JOB_API_BASE_URL", "JOB_API_KEY",
              "SITE_SESSIONS_DIR",
              "SERPAPI_API_KEY", "ANTHROPIC_API_KEY",
              "THE_STORE_OWNER", "THE_STORE_REPO", "THE_STORE_BRANCH", "THE_STORE_PATH",
          ]
          for key in optional:
              value = os.environ.get(key, "")
              if value:
                  data[key] = value

          with open("/tmp/env.yaml", "w") as f:
              yaml.safe_dump(data, f)
          PYEOF

      - name: Deploy orchestrator to Cloud Run
        run: |
          gcloud run deploy orchestrator \
            --source orchestrator/ \
            --project agent-ops-501120 \
            --region us-central1 \
            --allow-unauthenticated \
            --env-vars-file=/tmp/env.yaml \
            --memory=2Gi \
            --timeout=900
          # --memory: Cloud Run's default (512Mi) isn't reliably enough for
          # headless Chromium (sourcing_method: scraping, strategy: scrapeAll)
          # alongside the Node process itself.
          # --timeout: personal-pipeline requests are still fully synchronous
          # — scrapeAll/scrapeAny can process up to max_results candidates
          # sequentially in one request (§5.3's cost/latency note). 900s is a
          # rough accommodation, not a fix for that underlying design — a
          # request processing the full default max_results (10) could still
          # exceed it depending on model/render latency per candidate.
