# Thin per-app-repo caller for agent-ops's dev-pipeline-reusable.yml
# (strategy doc §4.5). This file is NOT pushed into app repos automatically
# from this session — I don't have write access to app repos like
# BusyBuddy_v2 from agent-ops. Copy this into
# `<app-repo>/.github/workflows/dev-pipeline.yml` yourself (roadmap Phase 3,
# step 1), or generate it automatically for future projects via the
# `scaffold_project` MCP tool (skills/shared/project-scaffold/SKILL.md),
# which writes this same content directly into a new repo once the GitHub
# App is installed there.
#
# Values below are pre-filled for the pilot repo (BusyBuddy_v2 / app-1),
# matching orchestrator/src/registry/projects.yaml — update both together
# if either changes.

name: dev-pipeline

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [agent-trigger]

jobs:
  dispatch:
    # Reusable-workflow permissions are the intersection of what this caller job
    # grants and what dev-pipeline-reusable.yml's own jobs request — id-token: write
    # must be granted here too, or the callee's own id-token: write (needed by
    # anthropics/claude-code-action@v1's OIDC request) has no effect.
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: HeyItsChloe/agent-ops/.github/workflows/dev-pipeline-reusable.yml@main
    with:
      project_language: typescript
      test_command: "npm test -- --coverage"
      coverage_type: cobertura
      desired_coverage: 85
      skill_folder: skills/app-1
      reviewer: heyitschloe
      action: >-
        ${{
          (github.event.label.name == 'approach-ready' && 'plan') ||
          (github.event.label.name == 'approved' && 'implement') ||
          (contains(github.event.comment.body, '@dev-agent plan') && 'plan') ||
          (contains(github.event.comment.body, '@dev-agent implement') && 'implement') ||
          github.event.client_payload.action
        }}
    secrets: inherit
