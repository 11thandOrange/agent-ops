# Dev projects — repos running the ticket pipeline (strategy doc §6).
# A new app repo is a new entry here, not new pipeline code. Fields match
# what the reusable GitHub Actions workflow (§4.5) needs, so nothing is
# hardcoded per-repo in a separate GitHub Actions variable.
#
# Kept separate from registry/personal/projects.yaml: dev and personal
# projects have non-overlapping schemas (types.ts's DevProjectEntry vs
# PersonalProjectEntry) and different consumers (this file feeds the
# reusable workflow's inputs; personal/projects.yaml feeds the personal
# pipeline job directly) — splitting the file makes that boundary visible,
# not just enforced in code.

- project: app-1
  type: dev
  repo: github.com/11thandOrange/BusyBuddy_v2
  model_profile: implementation
  test_gate: qodo
  project_language: [typescript]
  test_command: "npm test -- --coverage"
  coverage_type: cobertura
  desired_coverage: 85
  reviewer: heyitschloe
