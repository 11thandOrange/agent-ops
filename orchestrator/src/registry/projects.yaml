# The scaling mechanism (strategy doc §6): a new app repo or personal
# project is a new entry here, not new pipeline code. Fields match what
# the reusable GitHub Actions workflow (§4.5) needs, so nothing is
# hardcoded per-repo in a separate GitHub Actions variable.

- project: app-1
  type: dev
  repo: github.com/11thandOrange/BusyBuddy_v2
  model_profile: implementation
  test_gate: qodo
  project_language: [typescript]
  test_command: "npm test -- --coverage"
  coverage_type: cobertura
  desired_coverage: 85
  reviewer: heyitschloe
