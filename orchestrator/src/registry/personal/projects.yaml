# Personal-assistant projects — no repo, no CI runner. Read directly by
# the orchestrator's run_personal_pipeline job (not written into a
# generated GitHub Actions workflow the way registry/development/ is).
# A new personal project is a new entry here, not new pipeline code.

- project: resume-job-applier
  type: personal
  skill_path: skills/personal/resume-job-applier
  model_profile: planning
  # Independent per document: either can point at an existing Google Drive
  # doc (static, not tailored per posting) or be freshly drafted and
  # rendered to PDF each run. See SKILL.md for the tailoring trade-off.
  resume_source:
    mode: generated_pdf
  cover_letter_source:
    mode: generated_pdf
  # Which skill+script pair gathers job posting data: scraping | api | manual.
  # Default is scraping — a deliberate, accepted deviation from LinkedIn's
  # ToS (see SKILL.md's sourcing section), not an oversight. Override per
  # request or by changing this default.
  sourcing_method: scraping
